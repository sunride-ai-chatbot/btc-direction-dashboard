# Pulls the newest verified database snapshot off the Railway volume and stores it
# as a GitHub Release asset.
#
# Why this exists: the seven snapshots the app keeps all live on the SAME volume as
# the live database, so losing the volume loses them too. This job is the only copy
# that survives that, and it runs on GitHub's infrastructure — no laptop involved.
#
# It deliberately verifies the snapshot here as well as in the app. A backup nobody
# has opened is not a backup, and the whole point of this copy is that it is the one
# you fall back to when the other seven are gone.
name: Off-site database backup

on:
  schedule:
    # 04:00 UTC — one hour after the app's own 03:00 UTC snapshot, so the freshest
    # nightly backup is always on the volume by the time this runs.
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: offsite-backup
  cancel-in-progress: false

permissions:
  contents: write

env:
  API: https://btc-backend-production-f698.up.railway.app
  GH_REPO: ${{ github.repository }}
  # A snapshot compresses ~15x (75MB -> 5MB), so a month of daily restore points
  # costs about 150MB. Cheap enough that depth is not worth economising on.
  KEEP_RELEASES: 30

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download the newest snapshot
        env:
          TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then echo "::error::BACKUP_TOKEN secret is not set"; exit 1; fi

          curl -fsS --max-time 60 -H "Authorization: Bearer $TOKEN" "$API/api/admin/backups" -o listing.json
          NAME=$(python3 -c "import json;print(json.load(open('listing.json'))['backups'][0]['name'])")
          SIZE=$(python3 -c "import json;print(json.load(open('listing.json'))['backups'][0]['bytes'])")
          echo "newest snapshot: $NAME ($SIZE bytes)"

          # A failed backup on the server must fail this job too, otherwise we would
          # faithfully archive a stale snapshot and call it a fresh backup.
          ERR=$(python3 -c "import json;print(json.load(open('listing.json'))['last']['lastError'] or '')")
          if [ -n "$ERR" ]; then echo "::error::server reported a failed backup: $ERR"; exit 1; fi

          curl -fsS --max-time 900 -H "Authorization: Bearer $TOKEN" "$API/api/admin/backups/$NAME" -o snapshot.sqlite
          echo "NAME=$NAME" >> "$GITHUB_ENV"

          GOT=$(stat -c%s snapshot.sqlite)
          if [ "$GOT" -ne "$SIZE" ]; then
            echo "::error::truncated download: got $GOT bytes, listing said $SIZE"; exit 1
          fi

      - name: Verify it is a working database
        run: |
          set -euo pipefail
          OK=$(sqlite3 snapshot.sqlite 'PRAGMA integrity_check;')
          [ "$OK" = "ok" ] || { echo "::error::integrity_check returned '$OK'"; exit 1; }

          VER=$(sqlite3 snapshot.sqlite 'PRAGMA user_version;')
          [ "$VER" -ge 7 ] || { echo "::error::unexpected schema version $VER"; exit 1; }

          SIGNALS=$(sqlite3 snapshot.sqlite 'SELECT COUNT(*) FROM signals;')
          EVALS=$(sqlite3 snapshot.sqlite 'SELECT COUNT(*) FROM evaluations;')
          [ "$SIGNALS" -gt 0 ] || { echo "::error::snapshot has no signals"; exit 1; }

          # Guard against silent truncation: this archive must never hold fewer rows
          # than the last one we stored. Row counts only ever grow (pruning touches
          # raw inputs, never signals or evaluations).
          PREV=$(gh release list --repo "$GH_REPO" --limit 1 --json body --jq '.[0].body // ""' 2>/dev/null | grep -oP 'signals=\K[0-9]+' || echo 0)
          if [ "${PREV:-0}" -gt 0 ] && [ "$SIGNALS" -lt "$PREV" ]; then
            echo "::error::regression: $SIGNALS signals now vs $PREV in the previous backup"; exit 1
          fi

          echo "SIGNALS=$SIGNALS" >> "$GITHUB_ENV"
          echo "EVALS=$EVALS" >> "$GITHUB_ENV"
          echo "SCHEMA=$VER" >> "$GITHUB_ENV"
          echo "verified: signals=$SIGNALS evaluations=$EVALS schema=v$VER"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Compress and checksum
        run: |
          set -euo pipefail
          sha256sum snapshot.sqlite | cut -d' ' -f1 > sha256.txt
          gzip -9 -c snapshot.sqlite > "$NAME.gz"
          gzip -t "$NAME.gz"   # the archive itself must be readable
          echo "SHA=$(cat sha256.txt)" >> "$GITHUB_ENV"
          echo "RAW_MB=$(( $(stat -c%s snapshot.sqlite) / 1000000 ))" >> "$GITHUB_ENV"
          echo "GZ_MB=$(( $(stat -c%s "$NAME.gz") / 1000000 ))" >> "$GITHUB_ENV"

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="backup-$(date -u +%Y-%m-%d-%H%M)"
          gh release create "$TAG" "$NAME.gz" --repo "$GH_REPO" \
            --title "Database backup $(date -u +%Y-%m-%d)" \
            --notes "Verified snapshot pulled from the Railway volume.

          source=$NAME
          signals=$SIGNALS
          evaluations=$EVALS
          schema=v$SCHEMA
          sha256=$SHA
          size=${RAW_MB}MB raw / ${GZ_MB}MB compressed

          Restore: \`gunzip -c $NAME.gz > signals.sqlite\` then point DATABASE_PATH at it.
          Verified here with PRAGMA integrity_check before upload."

      - name: Prune old backups
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GH_REPO" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("backup-"))] | sort_by(.createdAt) | reverse | .['"$KEEP_RELEASES"':] | .[].tagName' \
            | while read -r TAG; do
                [ -n "$TAG" ] || continue
                echo "pruning $TAG"
                gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag
              done
